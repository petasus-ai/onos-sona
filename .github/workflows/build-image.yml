name: Build onos-sona image

# Builds the onos-sona (SONA / KubeVirt networking) container image with the
# repo Dockerfile and pushes a MULTI-ARCH (amd64 + arm64) manifest to
# quay.io/edgestack, matching the existing :kubevirt manifest. Each arch builds
# on a NATIVE runner (no QEMU) and pushes by digest; a final job stitches the
# per-arch digests into one tag. The Dockerfile runs `git log -10`, so the
# checkout must include full history (fetch-depth: 0).
#
# main publishes :dev. A tag vX.Y.Z on release-X.Y, checked by the shared release tag
# guard, publishes :vX.Y.Z once - a published release is never built again - and latest
# when it is the newest final release. A manual run publishes the tag it is given.
# :kubevirt, which main moved until the first release, stays frozen as that build.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag -> quay.io/edgestack/onos-sona-nightly-docker:<tag>"
        required: true
        default: "kubevirt"
      bazel_jobs:
        description: "Value for the Dockerfile JOBS arg (bazel --jobs)"
        required: false
        default: "4"

env:
  REGISTRY: quay.io
  IMAGE: quay.io/edgestack/onos-sona-nightly-docker

concurrency:
  group: build-image-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Guard the release tag
        if: github.ref_type == 'tag'
        uses: petasus-ai/.github/actions/guard-release-tag@987c4fc41f565d88e8879d2e204ff0d2ef369605
      - name: Decide the tags
        id: plan
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tags=""
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tags=$INPUT_TAG
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            if docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "::notice::$IMAGE:$GITHUB_REF_NAME is already published; a release is never rebuilt."
            else
              tags=$GITHUB_REF_NAME
              newest=$(git tag -l 'v*' | { grep -Ex 'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)' || true; } | sort -V | tail -n 1)
              [ "$newest" = "$GITHUB_REF_NAME" ] && tags="$tags latest"
            fi
          else
            tags=dev
          fi
          echo "tags=$tags"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.tags != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout (full history — Dockerfile runs `git log -10`)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to quay.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: edgestack
          password: ${{ secrets.QUAY_CI_BOT_SECRET }}

      - name: Build and push by digest (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          build-args: |
            JOBS=${{ github.event.inputs.bazel_jobs || '4' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifest
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to quay.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: edgestack
          password: ${{ secrets.QUAY_CI_BOT_SECRET }}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        env:
          TAGS: ${{ needs.plan.outputs.tags }}
        run: |
          args=()
          for tag in $TAGS; do args+=(-t "${IMAGE}:${tag}"); done
          # shellcheck disable=SC2046 # one argument per digest file
          docker buildx imagetools create "${args[@]}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        env:
          TAGS: ${{ needs.plan.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker buildx imagetools inspect "${IMAGE}:${tag}"
            echo "- \`${IMAGE}:${tag}\` (linux/amd64 + linux/arm64)" >> "$GITHUB_STEP_SUMMARY"
          done
