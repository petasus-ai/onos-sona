name: Build onos-sona image

# Builds the onos-sona (SONA / KubeVirt networking) container image with the
# repo Dockerfile and pushes a MULTI-ARCH (amd64 + arm64) manifest to the
# GitLab registry, matching the existing :kubevirt manifest. Each arch builds
# on a NATIVE runner (no QEMU) and pushes by digest; a final job stitches the
# per-arch digests into one tag. The Dockerfile runs `git log -10`, so the
# checkout must include full history (fetch-depth: 0).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag -> registry.gitlab.com/sonaproject/onos-sona-nightly-docker:<tag>"
        required: true
        default: "kubevirt"
      bazel_jobs:
        description: "Value for the Dockerfile JOBS arg (bazel --jobs)"
        required: false
        default: "4"

env:
  REGISTRY: registry.gitlab.com
  IMAGE: registry.gitlab.com/sonaproject/onos-sona-nightly-docker

concurrency:
  group: build-image-${{ github.event.inputs.tag || 'kubevirt' }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout (full history — Dockerfile runs `git log -10`)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitLab registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: sonaproject
          password: ${{ secrets.GITLAB_PROD_SECRET }}

      - name: Build and push by digest (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          build-args: |
            JOBS=${{ github.event.inputs.bazel_jobs || '4' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitLab registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: sonaproject
          password: ${{ secrets.GITLAB_PROD_SECRET }}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          tag="${{ github.event.inputs.tag || 'kubevirt' }}"
          docker buildx imagetools create -t "${IMAGE}:${tag}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        run: |
          tag="${{ github.event.inputs.tag || 'kubevirt' }}"
          docker buildx imagetools inspect "${IMAGE}:${tag}"
          {
            echo "### Built multi-arch image"
            echo "- \`${IMAGE}:${tag}\` (linux/amd64 + linux/arm64)"
          } >> "$GITHUB_STEP_SUMMARY"
